# Nginx do host → Quick Filler.
#
# Instalar como /etc/nginx/conf.d/quickfiller.conf na EC2.
#
# Segue o mesmo padrão dos arquivos já existentes na máquina
# (nicia-track.conf, mostqi.conf): um server block por domínio, proxy para uma
# porta de loopback. O Certbot acrescenta o bloco 443 e o redirecionamento
# sozinho ao rodar `--nginx`.

server {
    listen 80;
    listen [::]:80;
    server_name quickfiller.paulodev.net;

    # ------------------------------------------------------------------
    # OBRIGATÓRIO: o padrão do Nginx é 1 MB.
    #
    # Sem esta linha, todo upload acima de 1 MB é recusado pelo Nginx com 413
    # antes de chegar na aplicação — e sete dos oito PDFs oficiais do desafio
    # passam de 1 MB. O limite da aplicação é 20 MB; 25 MB dá folga para o
    # overhead do multipart.
    # ------------------------------------------------------------------
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8002;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O processamento é assíncrono: o POST responde 202 na hora e o resto é
        # polling. Estes valores cobrem o envio de um PDF grande em conexão
        # lenta e o download da planilha, não o tempo de OCR.
        proxy_connect_timeout 10s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;

        # A planilha e o PDF original são servidos inteiros; sem buffering o
        # download começa antes de o Nginx guardar tudo em disco.
        proxy_buffering off;
    }
}
