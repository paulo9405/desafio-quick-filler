<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Filler — Transcrição de documentos</title>
  <link rel="stylesheet" href="/static/bootstrap.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-body-tertiary">

<nav class="navbar bg-white border-bottom">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">Quick Filler</span>
    <span class="text-secondary small">Transcrição de cartões de ponto e holerites</span>
  </div>
</nav>

<main class="container-fluid py-3">

  <!-- ENVIO -->
  <section id="secao-envio" class="card mb-3">
    <div class="card-body">
      <form id="form-envio" class="row g-2 align-items-end">
        <div class="col-12 col-md-5">
          <label for="arquivo" class="form-label mb-1">Documento PDF</label>
          <input class="form-control" type="file" id="arquivo" accept="application/pdf" required>
        </div>
        <div class="col-8 col-md-4">
          <label for="tipo" class="form-label mb-1">Tipo</label>
          <select class="form-select" id="tipo" required>
            <option value="cartao-ponto">Cartão de ponto</option>
            <option value="holerite">Holerite</option>
          </select>
        </div>
        <div class="col-4 col-md-3">
          <button class="btn btn-primary w-100" type="submit" id="botao-enviar">Enviar</button>
        </div>
      </form>
    </div>
  </section>

  <!-- STATUS -->
  <section id="secao-status" class="card mb-3 d-none">
    <div class="card-body">
      <div class="d-flex align-items-center gap-3">
        <div id="spinner" class="spinner-border text-primary" role="status" aria-hidden="true"></div>
        <div class="flex-grow-1">
          <div id="status-titulo" class="fw-semibold">Processando…</div>
          <div id="status-detalhe" class="text-secondary small">
            Documentos escaneados passam por OCR e podem levar alguns minutos.
          </div>
        </div>
        <button class="btn btn-outline-secondary btn-sm" id="botao-novo" type="button">Enviar outro</button>
      </div>
      <div id="alerta-erro" class="alert alert-danger mt-3 mb-0 d-none" role="alert"></div>
    </div>
  </section>

  <!-- REVISÃO -->
  <section id="secao-revisao" class="d-none">
    <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
      <div id="resumo-avisos" class="small text-secondary flex-grow-1"></div>
      <div class="btn-group btn-group-sm" role="group" aria-label="Baixar planilha">
        <button type="button" class="btn btn-success" data-formato="xlsx">Baixar XLSX</button>
        <button type="button" class="btn btn-outline-success" data-formato="csv">CSV</button>
        <button type="button" class="btn btn-outline-success" data-formato="json">JSON</button>
      </div>
      <span id="estado-salvamento" class="badge text-bg-light border" aria-live="polite">Salvo</span>
    </div>

    <div class="row g-3">
      <div class="col-12 col-xl-7">
        <div class="card h-100">
          <div class="card-header py-2 d-flex justify-content-between align-items-center">
            <strong class="small">Transcrição</strong>
            <span class="small text-secondary">Clique numa célula para corrigir</span>
          </div>
          <div class="table-responsive" id="area-tabela"></div>
        </div>
      </div>
      <div class="col-12 col-xl-5">
        <div class="card h-100">
          <div class="card-header py-2"><strong class="small">Documento original</strong></div>
          <iframe id="visualizador-pdf" title="PDF original" class="w-100 border-0"></iframe>
        </div>
      </div>
    </div>

    <div class="card mt-3">
      <div class="card-body py-2 d-flex flex-wrap gap-3 small text-secondary">
        <span><span class="amostra-cor amostra-amarelo"></span> Batidas ímpares, página vazia ou leitura incerta</span>
        <span><span class="amostra-cor amostra-vermelho"></span> Data ou mês fora de sequência</span>
      </div>
    </div>
  </section>

</main>

<script src="/static/app.js"></script>
</body>
</html>
