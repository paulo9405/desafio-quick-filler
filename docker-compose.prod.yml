# Stack de produção para a EC2 existente.
#
# O `docker-compose.yml` principal NÃO é alterado por este arquivo — ele
# continua sendo o que a Quick Filler executa com `docker compose up`, que é o
# requisito duro do desafio.
#
# ARQUITETURA
#
#     Internet → HTTPS → Nginx (host) → 127.0.0.1:8002 → este container
#
# O TLS e o roteamento por domínio ficam com o Nginx que já existe na máquina e
# já serve outras aplicações. Este compose entrega apenas a aplicação numa
# porta de loopback.
#
# Como subir:
#
#     docker compose -f docker-compose.prod.yml up -d --build

services:
  app:
    build: .
    restart: unless-stopped

    # PORTA 8002, PUBLICADA SOMENTE EM LOOPBACK.
    #
    # Por que 8002 e não 8001: a 8001 está livre porque o container do MOSTQI
    # foi parado, mas ele continua existindo e pode ser religado. Ocupar a porta
    # dele criaria um conflito silencioso no dia em que isso acontecer. 8002 é
    # nova, e a numeração fica legível: 8000 Nícia, 8001 MOSTQI, 8002 Quick
    # Filler.
    #
    # O prefixo `127.0.0.1:` é a parte que importa para segurança. Sem ele o
    # Docker publica em 0.0.0.0 e insere uma regra de DNAT que passa por cima
    # do Security Group — a aplicação ficaria acessível pela internet em HTTP
    # puro, contornando o TLS. Com o prefixo, só o Nginx local alcança.
    ports:
      - "127.0.0.1:8002:8000"

    # LIMITE DE MEMÓRIA — protege os vizinhos, não a si mesmo.
    #
    # A instância tem ~912 MiB e já roda Nícia (~101 MiB) e PostgreSQL
    # (~41 MiB), nenhum deles com limite. Um pico do OCR (medido: 402 MB)
    # sem limite poderia levar o OOM killer do host a escolher a vítima — e
    # PostgreSQL é um alvo comum, por ser o processo com maior RSS.
    #
    # Com limite, o estouro fica contido no cgroup deste container: quem morre
    # é o Quick Filler, e a transcrição termina em `erro`. É o desfecho certo,
    # porque este é o serviço descartável dos três.
    #
    # `memswap_limit` maior que `mem_limit` libera a diferença em swap: até
    # 600 MiB de RAM e mais 1 GiB de swap como amortecedor de pico.
    mem_limit: 600m
    memswap_limit: 1600m

    environment:
      QF_DATABASE_PATH: /data/quickfiller.db
      QF_STORAGE_DIR: /data/pdfs

      QF_MAX_UPLOAD_BYTES: "20971520"
      QF_MAX_PDF_PAGES: "50"
      QF_RETENTION_HOURS: "24"

      # UM por vez, obrigatoriamente. Medido nesta aplicação: um documento OCR
      # chega a 402 MB de pico. A instância tem ~912 MiB no total, dividida com
      # outras duas aplicações. Dois jobs não cabem, com ou sem swap.
      QF_MAX_PROCESSAMENTO_SIMULTANEO: "1"

      QF_MIN_WORDS_TEXT_LAYER: "40"
      QF_OCR_LANG: por
      QF_OCR_DPI: "300"
      QF_OCR_PSM: "6"

      QF_LOG_LEVEL: INFO

    volumes:
      - qf-data:/data

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  # Nomeado pelo projeto do compose, então não colide com os volumes das outras
  # aplicações da máquina. Guarda o SQLite e os PDFs enviados.
  qf-data:
